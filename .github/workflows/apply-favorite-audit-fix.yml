          Path(".github/workflows/apply-favorite-audit-fix.yml").unlink()

      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          git status --short
          test -n "$(git status --short)"

      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize favorite interactions and lifecycle"
          git push origin HEAD:agent/favorite-audit-fix
