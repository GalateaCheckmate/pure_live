name: Apply Favorite Audit Fix

on:
  push:
    branches:
      - "agent/favorite-audit-fix"
    paths:
      - ".github/workflows/apply-favorite-audit-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-favorite-audit-fix
  cancel-in-progress: true

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/favorite-audit-fix
          fetch-depth: 0

      - name: Apply final audited fixes
        run: python tool/apply_favorite_audit_fix.py

      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          git status --short
          test -n "$(git status --short)"

      - name: Commit final audited fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete favorite interaction audit"
          git push origin HEAD:agent/favorite-audit-fix
