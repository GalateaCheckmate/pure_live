name: Windows Quick Check

# Fast validation for routine pushes; full Windows packaging is manual.
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "agent/**"
    paths-ignore:
      - "assets/releases.json"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: windows-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    name: Analyze and test Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub
