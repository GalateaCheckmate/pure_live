name: preview-build

on:
  push:
    branches:
      - build/2.0.22-recorder-preview

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 portable
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --verbose

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release/*"
          $zip = "PureLive-2.0.22-recorder-preview-windows-x64-portable.zip"
          Compress-Archive -Path $source -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File "$zip.sha256" -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-2.0.22-recorder-preview-windows
          path: |
            PureLive-2.0.22-recorder-preview-windows-x64-portable.zip
            PureLive-2.0.22-recorder-preview-windows-x64-portable.zip.sha256
          retention-days: 7
          if-no-files-found: error
