name: recorder-restore-autofix

on:
  push:
    branches: [agent/recorder-lifecycle-stability]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recorder-lifecycle-stability
      - name: Prefer pending recorder snapshot
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "chore: fix recorder restore priority" ]]; then
            exit 0
          fi
          python3 -c 'from pathlib import Path; p=Path("lib/recorder/pages/recorder/recorder_controller.dart"); s=p.read_text(); old="      final candidates = [\n        HivePrefUtil.getString(RecorderKeys.recorderTasks),\n        HivePrefUtil.getString(RecorderKeys.recorderTasksPending),\n        HivePrefUtil.getString(RecorderKeys.recorderTasksBackup),\n      ];"; new="      final candidates = [\n        HivePrefUtil.getString(RecorderKeys.recorderTasksPending),\n        HivePrefUtil.getString(RecorderKeys.recorderTasks),\n        HivePrefUtil.getString(RecorderKeys.recorderTasksBackup),\n      ];"; assert old in s, "expected restore block not found"; p.write_text(s.replace(old,new,1))'
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/recorder/pages/recorder/recorder_controller.dart
          git commit -m "chore: fix recorder restore priority"
          git push origin HEAD:agent/recorder-lifecycle-stability
