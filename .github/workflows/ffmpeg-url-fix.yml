name: ffmpeg-url-fix

on:
  push:
    branches:
      - build/2.0.22-recorder-preview

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'chore: apply Windows FFmpeg URL fix'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/2.0.22-recorder-preview
      - name: Replace unavailable Windows bundle
        shell: bash
        run: |
          sed -i 's#v0.10.2-windows/bundle-base-windows-x86_64-shared-lgpl.zip#v0.10.5-windows/bundle-base-windows-x86_64-shared-lgpl.zip#' pubspec.yaml
          grep 'windows: https://github.com/akashskypatel/ffmpeg-kit-builders' pubspec.yaml
      - name: Commit exact fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: apply Windows FFmpeg URL fix"
          git push origin HEAD:build/2.0.22-recorder-preview
