name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v2.0.23"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows packages
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build portable Windows release
        run: flutter build windows --release

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path "pubspec.yaml" -Pattern '^\s*version:\s*(\S+)' | Select-Object -First 1
          if (-not $line) {
            throw "Version not found in pubspec.yaml"
          }
          $version = $line.Matches[0].Groups[1].Value.Trim("`\"", "'")
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Capture Windows baseline
        shell: pwsh
        run: |
          ./tool/windows_baseline.ps1 `
            -ReleaseDirectory "build/windows/x64/runner/Release" `
            -ExecutablePath "build/windows/x64/runner/Release/pure_live.exe" `
            -SkipLaunch `
            -OutputPath "build/windows-baseline.json"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "PureLive-$version-windows-x64-portable.zip" `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = "https://jrsoftware.org/download.php/is.exe"
          $output = "${{ runner.temp }}\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          Start-Process `
            -FilePath $output `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait
          "C:\Program Files (x86)\Inno Setup 6" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Append `
            -Encoding utf8

      - name: Install Chinese Inno Setup language pack
        shell: pwsh
        run: |
          $source = "windows\packaging\exe\ChineseSimplified.isl"
          $target = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          if (Test-Path $source) {
            Copy-Item $source $target -Force
          }

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Configure optional MSIX signing
        id: package_targets
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
        run: |
          $targets = "exe"

          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE)) {
            $certBase64 = $env:CERTIFICATE.Trim() -replace '\s+', ''
            $certBytes = [System.Convert]::FromBase64String($certBase64)
            $certPath = Join-Path -Path (Get-Location) -ChildPath "certificate.pfx"
            [IO.File]::WriteAllBytes($certPath, $certBytes)

            $configPath = "windows/packaging/msix/make_config.yaml"
            $absolutePath = $certPath -replace '\\', '/'
            $content = Get-Content $configPath -Raw
            $content = $content -replace 'certificate_path:\s*.*', "certificate_path: $absolutePath"
            Set-Content $configPath $content

            $targets = "exe,msix"
          }

          "targets=$targets" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package Windows installers
        run: fastforge package --platform windows --targets "${{ steps.package_targets.outputs.targets }}"

      - name: Collect installers
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"

          $exe = Get-ChildItem "dist" -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Fastforge did not produce an EXE installer"
          }
          Copy-Item $exe.FullName "PureLive-$version-windows-x64-setup.exe"

          $msix = Get-ChildItem "dist" -Recurse -Filter "*.msix" | Select-Object -First 1
          if ($msix) {
            Copy-Item $msix.FullName "PureLive-$version-windows-x64.msix"
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            PureLive-*-windows-x64-setup.exe
            PureLive-*-windows-x64.msix
            PureLive-*-windows-x64-portable.zip
            build/windows-baseline.json
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows-installer

      - name: Build release body
        shell: bash
        run: |
          VERSION_DESCRIPTION="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("assets/version.json").read_text(encoding="utf-8"))
          print(data.get("version_desc", "Windows baseline release"))
          PY
          )"

          cat > release_body.md <<EOF
          # 纯粹直播 ${{ steps.tag.outputs.value }}

          ## Windows 版

          - 适用于 Windows 10/11 x64
          - EXE 安装包：常规安装
          - MSIX：仅在仓库配置签名证书时生成
          - Portable ZIP：解压后直接运行
          - 包含多直播源、弹幕、WebDAV、IPTV 与录制能力

          ## 本次更新

          ${VERSION_DESCRIPTION}
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.value }}
          body_path: release_body.md
          prerelease: false
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/windows-installer/*.exe
            artifacts/windows-installer/*.msix
            artifacts/windows-installer/*.zip
            artifacts/windows-installer/windows-baseline.json

  update-release-index:
    name: Update release index
    runs-on: ubuntu-latest
    needs: publish-release

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Update releases.json
        run: python update_releases.py

      - name: Commit release index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain assets/releases.json)" ]]; then
            echo "Release index is unchanged."
            exit 0
          fi

          git add assets/releases.json
          git commit -m "chore: update releases.json [skip ci]"
          git pull --rebase origin master
          git push origin master
