  drift_dev: ^2.33.0

flutter_icons:
  windows:
    generate: true
    image_path: assets/icons/icon.png
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/video/
    - assets/icons/
    - assets/webdav/
    - assets/keystore/
    - assets/version.json
    - assets/releases.json
    - assets/emo/images/huya/
    - assets/emo/images/douyu/
    - assets/emo/images/douyin/
    - assets/emo/images/bilibili/
    - assets/emo/json/
    - assets/translations/
    - assets/animations/loading.json
    - assets/animations/empty.json
    - assets/animations/error.json
    - assets/fonts/fonts-manifest.json
  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/icons/CustomIcons.ttf
    - family: PingFang
      fonts:
        - asset: assets/PingFangSC.ttf

ffmpeg_kit_extended_config:
  windows: https://github.com/akashskypatel/ffmpeg-kit-builders/releases/download/v0.10.5-windows/bundle-base-windows-x86_64-shared-lgpl.zip
